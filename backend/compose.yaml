services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-webmini}
      POSTGRES_USER: ${DB_USERNAME:-webmini}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-webmini}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - webmini-postgres-data:/var/lib/postgresql/data

volumes:
  webmini-postgres-data:
