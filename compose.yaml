services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-webmini}
      POSTGRES_USER: ${DB_USERNAME:-webmini}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-webmini}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - webmini-postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-webmini}
      DB_USERNAME: ${DB_USERNAME:-webmini}
      DB_PASSWORD: ${DB_PASSWORD:-webmini}
      # Allow all origins for local LAN demo so team members can access via host LAN IP.
      # For production or stricter local policies, restrict this value appropriately.
      APP_CORS_ALLOWED_ORIGINS: "*"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"

volumes:
  webmini-postgres-data:
