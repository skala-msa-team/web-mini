spring.application.name=web-mini-backend
server.port=${SERVER_PORT:8080}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.demo-user.header-name=${APP_DEMO_USER_HEADER_NAME:X-Demo-User-Id}
app.websocket.endpoint=${APP_WEBSOCKET_ENDPOINT:/ws}
app.websocket.heartbeat=${APP_WEBSOCKET_HEARTBEAT:10000,10000}
app.websocket.message-size-limit=${APP_WEBSOCKET_MESSAGE_SIZE_LIMIT:65536}
app.websocket.send-buffer-size-limit=${APP_WEBSOCKET_SEND_BUFFER_SIZE_LIMIT:131072}
app.websocket.send-time-limit=${APP_WEBSOCKET_SEND_TIME_LIMIT:20000}
app.ai.provider=${APP_AI_PROVIDER:mock}
app.ai.prompt-version=${APP_AI_PROMPT_VERSION:judge-v1}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/webmini}
spring.datasource.username=${DB_USERNAME:webmini}
spring.datasource.password=${DB_PASSWORD:webmini}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
