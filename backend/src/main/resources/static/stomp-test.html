<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STOMP Manual Test</title>
  <style>
    :root { color-scheme: light; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    body { max-width: 1080px; margin: 24px auto; padding: 0 16px; background: #f5f7fb; color: #172033; }
    h1 { margin-bottom: 4px; } .hint { color: #556070; margin-top: 0; }
    .panel { background: white; border: 1px solid #d9e0eb; border-radius: 10px; padding: 16px; margin: 16px 0; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    label { display: grid; gap: 6px; font-size: 13px; font-weight: 700; }
    input, button { font: inherit; padding: 9px 10px; border-radius: 6px; border: 1px solid #b9c4d4; }
    input { min-width: 0; } button { cursor: pointer; background: #f8fafc; } button:hover { background: #e9eff8; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .status { display: inline-block; margin-left: 8px; padding: 4px 8px; border-radius: 999px; font-size: 12px; background: #e7ebf1; }
    .status.connected { background: #d9f7e2; color: #146c32; } .status.error { background: #ffe0e0; color: #a01818; }
    #log { height: 430px; overflow: auto; padding: 12px; background: #111827; color: #d7e0ed; border-radius: 8px; white-space: pre-wrap; }
    .log-entry { border-left: 4px solid #7d8ba1; padding: 6px 10px; margin-bottom: 8px; background: #1b2638; }
    .chat { border-color: #57c4ff; } .event { border-color: #c58bff; } .error { border-color: #ff7777; } .success { border-color: #61d095; }
    @media (max-width: 650px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>Backend STOMP Manual Test <span id="status" class="status">DISCONNECTED</span></h1>
  <p class="hint">각 브라우저 탭에 다른 Demo User ID를 넣어 chat, events, user error queue를 비교합니다.</p>

  <section class="panel">
    <div class="grid">
      <label>WebSocket URL<input id="broker-url" value="ws://localhost:8080/ws" autocomplete="off"></label>
      <label>Trial ID<input id="trial-id" value="1" inputmode="numeric"></label>
      <label>Demo User ID<input id="demo-user-id" value="123e4567-e89b-12d3-a456-426614174000" autocomplete="off"></label>
      <label>Chat message<input id="chat-message" value="안녕하세요" autocomplete="off"></label>
    </div>
    <div class="actions">
      <button id="connect">Connect</button><button id="disconnect" disabled>Disconnect</button>
      <button id="subscribe-chat" disabled>Subscribe Chat</button><button id="subscribe-events" disabled>Subscribe Events</button>
      <button id="subscribe-errors" disabled>Subscribe Errors</button><button id="send-chat" disabled>Send Chat</button>
      <button id="clear-log">Clear Log</button>
    </div>
  </section>

  <section class="panel"><strong>Log</strong><div id="log" aria-live="polite"></div></section>
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.0/bundles/stomp.umd.min.js"></script>
  <script src="/stomp-test.js"></script>
</body>
</html>
